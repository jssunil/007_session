name: arm_f_kron_bytegrid_token
out_dir: results
model:
  d_model: 384
  n_layers: 6
  n_heads: 6
  d_ff_mult: 4
  seq_len: 512
  dropout: 0.0
  vocab_size: 32768
  input_path: kronecker
  output_head: bytegrid_token
  tie_projection: false
  token_bias: true
  pos_dim: 32
  ar_d_local: 128
  ar_n_layers: 2
  ar_n_heads: 4
train:
  seed: 1337
  max_steps: 12000
  batch_size: 32
  grad_accum: 1
  lr: 0.0003
  warmup_steps: 500
  min_lr_frac: 0.1
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  eval_every: 500
  eval_batches: 40
  checkpoint_every: 4000
  amp: true
  device: auto
data:
  data_dir: data
  tokenizer_dir: data/tokenizer
  train_bin: data/train.bin
  val_bin: data/val.bin
  token_dtype: uint16
